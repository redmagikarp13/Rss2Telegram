name: Scraper Cron

on:
  workflow_dispatch: # Permite rodar pelo GitHub Actions, com opção de ensaio
    inputs:
      dry_run:
        description: 'Ensaio: não envia nada ao Telegram e não grava o histórico'
        type: boolean
        default: false
      restore_run_id:
        description: 'Restaurar: id de um run cujo editais.db deve virar o estado atual (vazio = roda o scraper)'
        type: string
        default: ''
  schedule:
    - cron: '0 11 * * *' # Roda diariamente às 11:00 UTC (08:00 BRT)

jobs:
  # Caminho de recuperação do único estado que existe. Descoberto da pior forma: uma
  # rodada de ensaio não sobe artifact (não pode subir, ver o `if` no Upload), e passou
  # a ser o run bem-sucedido mais recente — o download do run seguinte procurou artifact
  # só nele, não achou, e o scraper abriu com banco vazio. Custou 1390 hashes de memória
  # e um aviso de "reinicialização" no chat. Este job refaz o estado a partir de
  # qualquer run anterior, sem apagar nada.
  restaurar-historico:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.restore_run_id != ''
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artifact do run informado
        uses: dawidd6/action-download-artifact@v6
        with:
          run-id: ${{ github.event.inputs.restore_run_id }}
          name: editais-db
          path: restaurar/

      - name: Validar antes de publicar
        # O `test -f` é a parte que importa: um restore com run-id errado publicaria um
        # banco vazio por cima do histórico inteiro, que é exatamente o acidente que
        # este job existe para consertar.
        run: |
          test -f restaurar/editais.db
          echo "restaurando $(sqlite3 restaurar/editais.db 'select count(*) from history') registros"
          touch restaurar/.primeira_exec_concluida

      - name: Publicar como estado atual
        uses: actions/upload-artifact@v4
        with:
          name: editais-db
          path: |
            restaurar/editais.db
            restaurar/.primeira_exec_concluida
          include-hidden-files: true
          retention-days: 90

  run-scraper:
    # Fica de fora enquanto um restore está em curso: os dois jobs subiriam um artifact
    # chamado editais-db no mesmo run, e o upload-artifact v4 recusa nomes duplicados.
    if: github.event.inputs.restore_run_id == ''
    runs-on: ubuntu-latest
    # 15 min era apertado demais: o run de 05/09 foi cancelado aos 15m18s no meio
    # do flood, e um cancelamento deixa o artifact desatualizado (o passo de upload
    # nao tem `if: always()`), entao o historico daquele dia se perde e os itens
    # voltam como "novos" na rodada seguinte. Margem para 51 fontes + Playwright.
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        id: download
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: scraper.yml
          workflow_conclusion: success
          name: editais-db
          # Por padrão ele olha só o run bem-sucedido MAIS RECENTE. Um run sem artifact
          # (como o de ensaio) quebrava a corrente e o scraper começava com banco vazio.
          # Com 5, ele volta até achar um run que realmente publicou editais-db.
          run-count: 5

      - name: Verificar histórico restaurado
        continue-on-error: true
        # Antes deste passo existir, ele era `mv editais.db editais.db` — movimento
        # sobre si mesmo, com o erro engolido por `|| true`. O artifact já é
        # extraído na raiz do workspace, então o passo não fazia nada. Agora ele
        # só diz a verdade sobre o que chegou: sem esta linha, um artifact não
        # restaurado passa despercebido no meio de um log verde.
        run: |
          if [ -f editais.db ]; then
            echo "✅ editais.db restaurado: $(wc -c < editais.db) bytes, $(sqlite3 editais.db 'select count(*) from history' 2>/dev/null || echo '?') registros no histórico"
          else
            echo "::warning::editais.db NÃO restaurado — o histórico será recriado do zero nesta rodada"
          fi
          if [ -f .primeira_exec_concluida ]; then
            echo "✅ marcador da primeira execução presente"
          else
            echo "::notice::.primeira_exec_concluida ausente (normal até a primeira execução rodar)"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        # Chromium headless para os portais que exigem JavaScript (ex: CNPq)
        run: playwright install --with-deps chromium

      - name: Run script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DESTINATION: ${{ secrets.DESTINATION }}
          # Configurável em Settings → Secrets and variables → Actions, tanto como
          # Variable (lugar certo para valor não-sensível) quanto como Secret — o
          # autor já tinha EDITAL_MAX_DIAS e MAX_ITENS_POR_FONTE cadastrados como
          # SECRET, e o workflow nunca os lia: só BOT_TOKEN e DESTINATION passavam.
          # O fallback || é obrigatório: uma chave ausente chega como string vazia,
          # que sem ele caía no default 0 e desligava os filtros de volume em
          # silêncio — o bot despejava o histórico inteiro (Proex 514, Agifes 430,
          # FACTO 160) direto no chat.
          EDITAL_MAX_DIAS: ${{ vars.EDITAL_MAX_DIAS || secrets.EDITAL_MAX_DIAS || '90' }}
          MAX_ITENS_POR_FONTE: ${{ vars.MAX_ITENS_POR_FONTE || secrets.MAX_ITENS_POR_FONTE || '10' }}
          # Teto agregado: o teto por fonte nao limita o total do chat (51 fontes
          # x 10 ainda somariam centenas de mensagens na mesma rodada).
          MAX_ITENS_POR_ESTADO: ${{ vars.MAX_ITENS_POR_ESTADO || secrets.MAX_ITENS_POR_ESTADO || '20' }}
          # O config já sabia ler DRYRUN; faltava o workflow expor. Com ele, uma
          # rodada de ensaio mostra no log exatamente o que seria enviado — sem
          # tocar no chat, que é o único lugar onde um erro desses é caro.
          DRYRUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python src/main.py

      - name: Upload artifact
        # Bloqueado no ensaio: em DRYRUN o _enviar_item devolve True sem enviar, e
        # o passo 6 do main.py registra no histórico como se tivesse chegado. Subir
        # esse banco faria os itens do ensaio sumirem para sempre do chat.
        if: github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: editais-db
          path: |
            editais.db
            .primeira_exec_concluida
          # Sem isto, o v4 descarta dotfiles em silêncio (include-hidden-files é
          # false por padrão): o marcador nunca subiu para o artifact, e a
          # proteção do main.py contra "banco perdido" nunca pôde disparar.
          # Confirmado baixando o artifact do run 34020367748: só editais.db dentro.
          include-hidden-files: true
          retention-days: 90 # Mantém o histórico por 90 dias

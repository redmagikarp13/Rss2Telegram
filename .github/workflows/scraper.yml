name: Scraper Cron

on:
  workflow_dispatch: # Permite rodar manualmente pelo GitHub Actions
  schedule:
    - cron: '0 11 * * *' # Roda diariamente às 11:00 UTC (08:00 BRT)

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        id: download
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: scraper.yml
          workflow_conclusion: success
          name: editais-db

      - name: Move database and marker
        continue-on-error: true
        # Se o artefato foi baixado, movemos de volta para o diretório raiz
        run: |
          mv editais.db editais.db || true
          mv .primeira_exec_concluida .primeira_exec_concluida || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        # Chromium headless para os portais que exigem JavaScript (ex: CNPq)
        run: playwright install --with-deps chromium

      - name: Run script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DESTINATION: ${{ secrets.DESTINATION }}
          # Configuravel em Settings → Secrets and variables → Actions → Variables.
          # O fallback || é obrigatório: uma Variable ausente chega como string
          # vazia, que sem ele caía no default 0 e desligava os filtros de volume
          # em silêncio — o bot despejava o histórico inteiro (Proex 514, Agifes
          # 430, FACTO 160) direto no chat.
          EDITAL_MAX_DIAS: ${{ vars.EDITAL_MAX_DIAS || '90' }}
          MAX_ITENS_POR_FONTE: ${{ vars.MAX_ITENS_POR_FONTE || '10' }}
          # Teto agregado: o teto por fonte nao limita o total do chat (51 fontes
          # x 10 ainda somariam centenas de mensagens na mesma rodada).
          MAX_ITENS_POR_ESTADO: ${{ vars.MAX_ITENS_POR_ESTADO || '20' }}
        run: |
          python src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: editais-db
          path: |
            editais.db
            .primeira_exec_concluida
          retention-days: 90 # Mantém o histórico por 90 dias
